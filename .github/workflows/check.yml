name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Quality gate on D1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Match the local npm version
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: pwsh -NoProfile -File scripts/check.ps1
        env:
          STORAGE_TEST_BACKEND: d1
