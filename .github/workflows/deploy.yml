name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Check, migrate and deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: production
      url: https://onestopshop.jonknu92-c9d.workers.dev
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm

      - name: Match the local npm version
        run: npm install --global npm@11.19.0

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: pwsh -NoProfile -File scripts/check.ps1
        env:
          STORAGE_TEST_BACKEND: d1

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply onestopshop --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Build
        run: npx opennextjs-cloudflare build

      - name: Deploy
        run: npx opennextjs-cloudflare deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
